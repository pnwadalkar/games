<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Sign in · GameNest</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body class="auth">
  <div class="auth-bg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main class="auth-card">
    <a class="logo" href="./"><span class="logo-mark">🎮</span><span class="txt">GameNest</span></a>
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Sign in to keep your scores, favorites and recent games.</p>

    <div class="tabs" role="tablist">
      <button class="tab on" id="tabIn" role="tab" aria-selected="true">Sign in</button>
      <button class="tab" id="tabUp" role="tab" aria-selected="false">Create account</button>
    </div>

    <form id="form" novalidate autocomplete="on">
      <label class="field"><span>Username</span>
        <input id="user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required>
      </label>
      <label class="field"><span>Password</span>
        <span class="pw">
          <input id="pw" name="password" type="password" autocomplete="current-password" minlength="6" required>
          <button type="button" class="eye" id="eye" aria-label="Show password">👁</button>
        </span>
      </label>
      <label class="field" id="pw2Row" hidden><span>Confirm password</span>
        <input id="pw2" type="password" autocomplete="new-password" minlength="6">
      </label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary wide" id="go" type="submit">Sign in</button>
    </form>

    <div class="or"><span>or</span></div>
    <a class="btn wide" id="guest" href="./">Play as guest</a>
    <p class="fine">Accounts are stored in this browser on this device only. Nothing is sent to a server.</p>
  </main>
  <script src="js/core.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
