<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="GameNest: a big collection of free mini games that run in your browser on laptop and mobile.">
  <title>GameNest · Mini Games</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="logo" href="./"><span class="logo-mark">🎮</span><span class="txt">GameNest<small>mini games</small></span></a>
      <label class="search">
        <span aria-hidden="true">🔎</span>
        <input id="q" type="search" placeholder="Search games…" autocomplete="off" aria-label="Search games">
      </label>
      <button class="pill-btn" id="random" title="Play a random game">🎲 <span class="lbl">Random</span></button>
      <div class="user" id="user"></div>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <h1>Play <span id="count">lots of</span> mini games</h1>
      <p>Free, no install. Sign in to save your scores, or just jump in as a guest.</p>
    </section>

    <nav class="chips" id="chips" aria-label="Categories"></nav>

    <section id="recentSec" hidden>
      <div class="section-title"><h2>Continue playing</h2></div>
      <div class="row" id="recent"></div>
    </section>

    <section id="favSec" hidden>
      <div class="section-title"><h2>★ Favorites</h2></div>
      <div class="row" id="favs"></div>
    </section>

    <section>
      <div class="section-title"><h2 id="listTitle">All games</h2><span id="listCount"></span></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>No games match your search.</div>
    </section>

    <div class="foot">GameNest · all games run offline in your browser · scores are saved on this device</div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/registry.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
